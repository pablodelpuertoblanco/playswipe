spring.application.name=backend
server.port=${PORT:8080}
server.address=0.0.0.0

# Credenciales de Firebase Admin: ruta al JSON de la cuenta de servicio.
# El archivo NO se incluye en el repositorio. Ejemplo:
#   FIREBASE_CREDENTIALS=C:/claves/firebase-playswipe.json
firebase.credentials=${FIREBASE_CREDENTIALS:}

# Base de datos MySQL (variables de entorno; los valores por defecto son para local).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/playswipe}
spring.datasource.username=${DB_USER:playswipe}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4
